name: WallaForged

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config.json from template
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -c "
          import json, os
          with open('config.example.json') as f:
              cfg = json.load(f)
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          cfg['notifications']['telegram']['bot_token'] = token
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print('config.json generado')
          "

      - name: Run WallaForged
        env:
          PYTHONUNBUFFERED: "1"
        run: python wallaforged.py --once

      - name: Commit state back
        run: |
          git config user.name "wallaforged-bot"
          git config user.email "bot@wallaforged.app"
          git add wallaforged_seen_items.json
          git diff --staged --quiet || git commit -m "auto: update state [skip ci]"
          git push
